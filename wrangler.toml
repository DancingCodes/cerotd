name = "cerotd"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
main = "./.output/server/index.mjs"

[assets]
directory = "./.output/public"

[[routes]]
pattern = "moonc.love"
custom_domain = true

[[routes]]
pattern = "www.moonc.love"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "cerotd"
database_id = "f1c1d1b6-4952-401e-a005-49cad234dfa6"
migrations_dir = "database/migrations"
remote = false

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cerotd-media"
remote = false
